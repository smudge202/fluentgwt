name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Format
        run: dotnet format FluentGwt.slnx --verify-no-changes

      - name: Build
        run: dotnet build FluentGwt.slnx -warnaserror

      - name: Test
        run: dotnet test --solution FluentGwt.slnx --no-build --report-trx --results-directory TestResults/default --minimum-expected-tests 300

      - name: Test the integration build
        run: dotnet test --solution FluentGwt.slnx -p:FluentGwtIntegration=true --report-trx --results-directory TestResults/integration --minimum-expected-tests 300

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: TestResults

  alpha:
    name: Publish an alpha to GitHub Packages
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Pack
        run: dotnet pack FluentGwt.slnx -c Release -o artifacts

      - name: Refuse a version that is not above the latest release
        run: |
          latest=$(git tag --list 'v*' --sort=-v:refname | head -n 1)
          latest=${latest#v}
          package=$(basename artifacts/FluentGwt.[0-9]*.nupkg .nupkg)
          version=${package#FluentGwt.}
          release=${version%%-*}
          echo "Packed $version; latest release ${latest:-none}"
          if [ -n "$latest" ] && { [ "$release" = "$latest" ] || [ "$(printf '%s\n' "$latest" "$release" | sort -V | tail -n 1)" != "$release" ]; }; then
            echo "::error::$version is not above the latest release $latest. Merge main into dev so MinVer can see the release tag."
            exit 1
          fi

      - name: Push to GitHub Packages
        run: >-
          dotnet nuget push "artifacts/*.nupkg"
          --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"
          --api-key "${{ secrets.GITHUB_TOKEN }}"
          --no-symbols
          --skip-duplicate
